name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-rpm:
    name: Build ${{ matrix.arch }} RPM
    runs-on: ${{ matrix.runner }}
    container:
      image: fedora:43
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rpm_arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          dnf install -y \
            cmake gcc-c++ make rpm-build rpmdevtools \
            qt6-qtbase-devel qt6-qtdeclarative-devel \
            kf6-kcolorscheme-devel kf6-kio-devel \
            zxing-cpp-devel pcsc-lite-devel

      - name: Build RPM
        run: |
          RPMBUILD_TOPDIR="${{ github.workspace }}/rpmbuild" \
            ./build-rpm.sh "${{ steps.version.outputs.VERSION }}"

      - name: Prepare artifacts
        run: |
          mkdir -p release-rpm-${{ matrix.arch }}
          cp rpmbuild/RPMS/${{ matrix.rpm_arch }}/*.rpm "release-rpm-${{ matrix.arch }}/"
          ls -lh release-rpm-${{ matrix.arch }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-rpm-${{ matrix.arch }}
          path: release-rpm-${{ matrix.arch }}/*
          retention-days: 1

  build-deb:
    name: Build ${{ matrix.arch }} DEB and tarball
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:trixie
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            deb_arch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y \
            cmake g++ ninja-build git dpkg-dev \
            qt6-base-dev qt6-declarative-dev \
            libkf6colorscheme-dev libkf6kio-dev \
            libzxing-dev libpcsclite-dev

      - name: Build native app
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: Build DEB
        run: ./build-deb.sh "${{ steps.version.outputs.VERSION }}" "${{ matrix.deb_arch }}"

      - name: Create tarball
        run: |
          TARBALL_NAME="gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.arch }}"
          mkdir -p "/tmp/${TARBALL_NAME}"
          cp build/gosh-authenticator "/tmp/${TARBALL_NAME}/"
          cp data/applications/com.goshapps.YubicoAuthenticator.desktop "/tmp/${TARBALL_NAME}/"
          cp icon.svg "/tmp/${TARBALL_NAME}/"
          cp README.md "/tmp/${TARBALL_NAME}/"
          cd /tmp
          tar -czf "${TARBALL_NAME}.tar.gz" "${TARBALL_NAME}"
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          mv "${TARBALL_NAME}.tar.gz" "${GITHUB_WORKSPACE}/dist/"

      - name: Prepare artifacts
        run: |
          mkdir -p release-deb-${{ matrix.arch }}
          cp dist/*_${{ matrix.deb_arch }}.deb "release-deb-${{ matrix.arch }}/"
          cp dist/*-${{ matrix.arch }}.tar.gz "release-deb-${{ matrix.arch }}/"
          ls -lh release-deb-${{ matrix.arch }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-deb-${{ matrix.arch }}
          path: release-deb-${{ matrix.arch }}/*
          retention-days: 1

  build-flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.9
      options: --privileged
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gosh-authenticator-${{ github.ref_name }}-${{ matrix.arch }}.flatpak
          manifest-path: com.goshapps.YubicoAuthenticator.yml
          cache-key: flatpak-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}

  create-release:
    name: Create GitHub Release
    needs:
      - build-rpm
      - build-deb
      - build-flatpak
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.rpm" -o -name "*.deb" -o -name "*.tar.gz" -o -name "*.flatpak" \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Gosh Yubico Authenticator v${{ steps.version.outputs.VERSION }}

            Native Qt 6 / Kirigami desktop application for managing OATH credentials on YubiKey devices.

            ### Downloads

            **Flatpak (recommended):**
            - `gosh-authenticator-v${{ steps.version.outputs.VERSION }}-x86_64.flatpak`
            - `gosh-authenticator-v${{ steps.version.outputs.VERSION }}-aarch64.flatpak`

            **x86_64 / x64:**
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-1.fc43.x86_64.rpm`
            - `gosh-authenticator_${{ steps.version.outputs.VERSION }}_amd64.deb`
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz`

            **ARM64 / aarch64:**
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-1.fc43.aarch64.rpm`
            - `gosh-authenticator_${{ steps.version.outputs.VERSION }}_arm64.deb`
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz`

            ### Installation

            **Flatpak:** `flatpak install --user ./gosh-authenticator-v${{ steps.version.outputs.VERSION }}-x86_64.flatpak`

            **RPM:** `sudo dnf install gosh-authenticator-*.rpm`

            **DEB:** `sudo apt install ./gosh-authenticator_*.deb` (needs KDE Frameworks 6: Debian 13+, Ubuntu 24.10+)

            **Tarball:** Extract and run `./gosh-authenticator` (needs Qt 6 and Kirigami installed)

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full installation instructions.

            ### Checksums
            Verify downloads with `sha256sum -c SHA256SUMS`
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
