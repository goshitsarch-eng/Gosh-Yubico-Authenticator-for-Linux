name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: '3.27.3'

jobs:
  build-packages:
    name: Build ${{ matrix.arch }} packages
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rpm_arch: x86_64
            deb_arch: amd64
            flutter_arch_dir: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            rpm_arch: aarch64
            deb_arch: arm64
            flutter_arch_dir: arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install Flutter
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Flutter (arm64)
        if: matrix.arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git -b "${FLUTTER_VERSION}" --depth 1
          export PATH="$(pwd)/flutter/bin:$PATH"
          flutter config --no-analytics
          flutter --version
          echo "$(pwd)/flutter/bin" >> "$GITHUB_PATH"

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl git unzip xz-utils zip \
            gcc g++ \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libpcsclite-dev \
            rpm dpkg-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Prepare output dirs
        run: |
          mkdir -p dist rpmbuild

      - name: Build Flutter app
        run: |
          cd flutter_app
          flutter pub get
          flutter build linux --release

      - name: Build RPM
        run: |
          RPMBUILD_TOPDIR="${{ github.workspace }}/rpmbuild" \
            ./build-rpm.sh "${{ steps.version.outputs.VERSION }}"

      - name: Build DEB
        run: ./build-deb.sh "${{ steps.version.outputs.VERSION }}" "${{ matrix.deb_arch }}"

      - name: Create tarball
        run: |
          cd "flutter_app/build/linux/${{ matrix.flutter_arch_dir }}/release"
          TARBALL_NAME="gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-${{ matrix.arch }}"
          mkdir -p "/tmp/${TARBALL_NAME}"
          cp -r bundle/* "/tmp/${TARBALL_NAME}/"
          cp ../../../../com.github.gosh.gosh_yubikey_manager.desktop "/tmp/${TARBALL_NAME}/"
          cp ../../../../../icon.svg "/tmp/${TARBALL_NAME}/"
          cp ../../../../../README.md "/tmp/${TARBALL_NAME}/"
          cd /tmp
          tar -czf "${TARBALL_NAME}.tar.gz" "${TARBALL_NAME}"
          mv "${TARBALL_NAME}.tar.gz" "${{ github.workspace }}/dist/"

      - name: Prepare artifacts
        run: |
          mkdir -p release-${{ matrix.arch }}
          cp "rpmbuild/RPMS/${{ matrix.rpm_arch }}"/*.rpm "release-${{ matrix.arch }}/"
          cp "dist/*_${{ matrix.deb_arch }}.deb" "release-${{ matrix.arch }}/"
          cp "dist/*-${{ matrix.arch }}.tar.gz" "release-${{ matrix.arch }}/"
          ls -lh release-${{ matrix.arch }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: release-${{ matrix.arch }}/*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.rpm" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Gosh Authenticator v${{ steps.version.outputs.VERSION }}
            
            ### Downloads
            
            **x86_64 / x64:**
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-1.fc43.x86_64.rpm` - RPM package for Fedora/RHEL
            - `gosh-authenticator_${{ steps.version.outputs.VERSION }}_amd64.deb` - DEB package for Debian/Ubuntu
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz` - Portable tarball
            
            **ARM64 / aarch64:**
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-1.fc43.aarch64.rpm` - RPM package for Fedora/RHEL
            - `gosh-authenticator_${{ steps.version.outputs.VERSION }}_arm64.deb` - DEB package for Debian/Ubuntu
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz` - Portable tarball
            
            ### Installation
            
            **RPM:** `sudo dnf install gosh-authenticator-*.rpm`

            **DEB:** `sudo apt install ./gosh-authenticator_*.deb`
            
            **Tarball:** Extract and run `./gosh_yubikey_manager`
            
            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full installation instructions.
            
            ### Checksums
            Verify downloads with `sha256sum -c SHA256SUMS`
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
