name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Verify version and required artifacts
        run: |
          python3 scripts/release-artifacts.py artifacts release --tag "$GITHUB_REF_NAME"
          cd release
          sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Gosh Yubico Authenticator ${{ github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Rust and Dioxus Desktop migration. Review PLATFORM_SUPPORT.md and QA.md before publishing.
            Windows MSI requires WebView2. macOS app bundles are ad-hoc signed and not notarized.
            Linux tarballs require WebKitGTK 4.1 / GTK 3 and host PC/SC; Flatpak contains its own UI runtime.
            Verify downloads with SHA256SUMS. This workflow creates a draft release for review.
