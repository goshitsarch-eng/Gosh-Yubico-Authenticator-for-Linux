name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: '3.27.1'

jobs:
  build-packages:
    name: Build ${{ matrix.arch }} packages
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - arch: x64
            rpm_arch: x86_64
          - arch: arm64
            rpm_arch: aarch64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.arch == 'arm64'
        uses: docker/setup-buildx-action@v3

      # x64 native build
      - name: Install Flutter (x64)
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies (x64)
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libpcsclite-dev \
            rpm

      - name: Install Rust (x64)
        if: matrix.arch == 'x64'
        uses: dtolnay/rust-toolchain@stable

      - name: Build Flutter app (x64)
        if: matrix.arch == 'x64'
        run: |
          cd flutter_app
          flutter pub get
          flutter build linux --release

      - name: Install RPM build dependencies (x64)
        if: matrix.arch == 'x64'
        run: |
          sudo apt-get install -y \
            gcc g++ cargo rustc

      - name: Build RPM (x64)
        if: matrix.arch == 'x64'
        run: ./build-rpm.sh

      - name: Create tarball (x64)
        if: matrix.arch == 'x64'
        run: |
          cd flutter_app/build/linux/x64/release
          TARBALL_NAME="gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-x64"
          mkdir -p "/tmp/${TARBALL_NAME}"
          cp -r bundle/* "/tmp/${TARBALL_NAME}/"
          cp ../../../../com.github.gosh.gosh_yubikey_manager.desktop "/tmp/${TARBALL_NAME}/"
          cp ../../../../../icon.svg "/tmp/${TARBALL_NAME}/"
          cp ../../../../../README.md "/tmp/${TARBALL_NAME}/"
          cd /tmp
          tar -czf "${TARBALL_NAME}.tar.gz" "${TARBALL_NAME}"
          mv "${TARBALL_NAME}.tar.gz" "${{ github.workspace }}/dist/"

      # arm64 cross-compile build
      - name: Build packages (arm64)
        if: matrix.arch == 'arm64'
        run: |
          docker run --rm --platform linux/arm64/v8 \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            ubuntu:22.04 \
            bash -c "
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && \
              apt-get install -y \
                curl git unzip xz-utils zip \
                clang cmake ninja-build pkg-config \
                libgtk-3-dev libpcsclite-dev \
                rpm && \
              
              # Install Flutter
              git clone https://github.com/flutter/flutter.git -b stable --depth 1 && \
              export PATH=\$PATH:\$(pwd)/flutter/bin && \
              flutter config --no-analytics && \
              
              # Install Rust
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y && \
              source ~/.cargo/env && \
              
              # Build Flutter app
              cd flutter_app && \
              flutter pub get && \
              flutter build linux --release && \
              cd .. && \
              
              # Build RPM
              ./build-rpm.sh && \
              
              # Create tarball
              cd flutter_app/build/linux/arm64/release && \
              TARBALL_NAME='gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-arm64' && \
              mkdir -p /tmp/\${TARBALL_NAME} && \
              cp -r bundle/* /tmp/\${TARBALL_NAME}/ && \
              cp ../../../../com.github.gosh.gosh_yubikey_manager.desktop /tmp/\${TARBALL_NAME}/ && \
              cp ../../../../../icon.svg /tmp/\${TARBALL_NAME}/ && \
              cp ../../../../../README.md /tmp/\${TARBALL_NAME}/ && \
              cd /tmp && \
              tar -czf \${TARBALL_NAME}.tar.gz \${TARBALL_NAME} && \
              mv \${TARBALL_NAME}.tar.gz /workspace/dist/
            "

      - name: Prepare artifacts
        run: |
          mkdir -p release-${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = "x64" ]; then
            cp ~/rpmbuild/RPMS/x86_64/*.rpm release-${{ matrix.arch }}/
            cp dist/*-x64.tar.gz release-${{ matrix.arch }}/
          else
            cp ~/rpmbuild/RPMS/aarch64/*.rpm release-${{ matrix.arch }}/ 2>/dev/null || true
            cp dist/*-arm64.tar.gz release-${{ matrix.arch }}/ 2>/dev/null || true
          fi
          ls -lh release-${{ matrix.arch }}/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: release-${{ matrix.arch }}/*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-packages
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.rpm" -o -name "*.tar.gz" \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Gosh Authenticator v${{ steps.version.outputs.VERSION }}
            
            ### Downloads
            
            **x86_64 / x64:**
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-1.fc43.x86_64.rpm` - RPM package for Fedora/RHEL
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-x64.tar.gz` - Portable tarball
            
            **ARM64 / aarch64:**
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-1.fc43.aarch64.rpm` - RPM package for Fedora/RHEL
            - `gosh-authenticator-${{ steps.version.outputs.VERSION }}-linux-arm64.tar.gz` - Portable tarball
            
            ### Installation
            
            **RPM:** `sudo dnf install gosh-authenticator-*.rpm`
            
            **Tarball:** Extract and run `./gosh_yubikey_manager`
            
            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for full installation instructions.
            
            ### Checksums
            Verify downloads with `sha256sum -c SHA256SUMS`
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
