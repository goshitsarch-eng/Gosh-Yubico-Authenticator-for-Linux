name: CI
on:
  push:
    branches: ['main', 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==8.3.5 Pillow==11.1.0
      - run: python -m pytest tests
      - run: python flatpak/generate-cargo-sources.py --check
      - run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate --no-net data/metainfo/com.goshapps.YubicoAuthenticator.metainfo.xml

  native:
    name: Native ${{ matrix.os }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, os: linux, arch: x64, deb_arch: amd64, binary: gosh-authenticator}
          - {runner: ubuntu-24.04-arm, os: linux, arch: arm64, deb_arch: arm64, binary: gosh-authenticator}
          - {runner: windows-2022, os: windows, arch: x64, binary: gosh-authenticator.exe}
          - {runner: macos-15, os: macos, arch: arm64, binary: gosh-authenticator}
          - {runner: macos-15-intel, os: macos, arch: x64, binary: gosh-authenticator}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev libpcsclite-dev pcscd libccid rpm dpkg-dev xvfb xauth dbus-x11 python3-gi python3-pyatspi python3-pil xdotool xclip at-spi2-core xdg-desktop-portal-gtk
          sudo systemctl start pcscd.socket
      - if: matrix.os == 'windows'
        run: dotnet tool install --global wix --version 6.0.2
      - run: python -m pip install Pillow==11.1.0
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --locked --all-targets --all-features --manifest-path rust/Cargo.toml -- -D warnings
      - run: cargo test --locked --all-features --manifest-path rust/Cargo.toml
      - run: cargo test --locked --no-default-features --manifest-path rust/Cargo.toml
      - if: matrix.os == 'linux'
        run: xvfb-run -a cargo test --locked --all-features --manifest-path rust/Cargo.toml --test native_clipboard -- --ignored
      - if: matrix.os != 'linux'
        run: cargo test --locked --all-features --manifest-path rust/Cargo.toml --test native_clipboard -- --ignored
      - run: cargo build --locked --release --manifest-path rust/Cargo.toml
      - if: matrix.os == 'linux'
        run: |
          # System Python has distro GI/AT-SPI bindings.
          PATH=/usr/bin:$PATH bash scripts/run-linux-smoke.sh "$PWD/rust/target/release/gosh-authenticator"
      - if: matrix.os != 'linux'
        run: python scripts/native-launch-smoke.py rust/target/release/${{ matrix.binary }}
      - run: python scripts/package.py --platform ${{ matrix.os }} --arch ${{ matrix.arch }} --binary rust/target/release/${{ matrix.binary }}
      - if: matrix.os == 'linux'
        run: |
          bash build-deb.sh "$(python -c 'import tomllib; print(tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"])')" "${{ matrix.deb_arch }}"
          bash build-rpm.sh
          cp rpmbuild/RPMS/*/*.rpm dist/
          dpkg-deb --contents dist/*.deb
          rpm -qlp dist/*.rpm
      - if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/*.msi).FullName
          $installed = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($installed.ExitCode -notin @(0,3010)) { throw "MSI install failed: $($installed.ExitCode)" }
          $app = Join-Path $env:ProgramFiles 'Gosh Yubico Authenticator/gosh-authenticator.exe'
          if (!(Test-Path $app)) { throw 'Installed binary missing' }
          python scripts/native-launch-smoke.py "$app"
          $removed = Start-Process msiexec.exe -ArgumentList @('/x', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($removed.ExitCode -notin @(0,3010)) { throw "MSI uninstall failed: $($removed.ExitCode)" }
          if (Test-Path $app) { throw 'Uninstall left installed binary behind' }
      - if: matrix.os == 'macos'
        run: |
          mkdir -p /tmp/gosh-bundle-check
          ditto -x -k dist/*.zip /tmp/gosh-bundle-check
          codesign --verify --deep --strict '/tmp/gosh-bundle-check/Gosh Yubico Authenticator.app'
          plutil -lint '/tmp/gosh-bundle-check/Gosh Yubico Authenticator.app/Contents/Info.plist'
          python scripts/native-launch-smoke.py '/tmp/gosh-bundle-check/Gosh Yubico Authenticator.app/Contents/MacOS/gosh-authenticator'
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit --file rust/Cargo.lock

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64}
          - {runner: ubuntu-24.04-arm, arch: aarch64}
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - run: python3 flatpak/generate-cargo-sources.py --check
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: gosh-authenticator-${{ matrix.arch }}.flatpak
          manifest-path: com.goshapps.YubicoAuthenticator.yml
          cache-key: flatpak-${{ matrix.arch }}-${{ github.sha }}
          arch: ${{ matrix.arch }}
      - run: |
          flatpak install --user --noninteractive --reinstall gosh-authenticator-${{ matrix.arch }}.flatpak
          flatpak run com.goshapps.YubicoAuthenticator --version
