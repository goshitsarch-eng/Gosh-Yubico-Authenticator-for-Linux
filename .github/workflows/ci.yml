name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  flatpak-metadata:
    name: Flatpak metadata
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check cargo-sources.json
        run: python3 flatpak/generate-cargo-sources.py --check

      - name: Validate AppStream metainfo
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream
          appstreamcli validate --no-net --explain \
            data/metainfo/com.goshapps.YubicoAuthenticator.metainfo.xml
