app-id: com.github.gosh.gosh_yubikey_manager
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gosh-authenticator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pcsc
  - --device=dri
  - --device=all
  - --share=network
  - --require-version=1.3.2
cleanup:
  - /bin/pcsc-spy
  - /include
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - "*.la"
  - "*.a"
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_NET_OFFLINE: "true"
modules:
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibudev=false
      - -Dlibsystemd=false
      - -Dpolkit=false
    post-install:
      - rm -f /app/sbin/pcscd
      - rmdir /app/sbin || true
    cleanup:
      - /lib/libpcscspy.so
      - /lib/libpcsclite.so
      - /lib64/libpcscspy.so
      - /lib64/libpcsclite.so
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.1.tar.xz
        sha256: bfcfe38a20afc49849c6bf55325e38f449fc4b26d3923fdc32b969ae41a8741b
        x-checker-data:
          type: anitya
          project-id: 2611
          url-template: https://pcsclite.apdu.fr/files/pcsc-lite-$version.tar.xz

  - name: gosh-authenticator
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/gosh-authenticator/cargo
        CARGO_NET_OFFLINE: "true"
    build-commands:
      - rustc --version
      - cargo --offline build --locked --release --manifest-path rust/Cargo.toml --verbose
      - install -Dm755 rust/target/release/gosh-authenticator /app/bin/gosh-authenticator
      - install -Dm644 data/applications/com.github.gosh.gosh_yubikey_manager.desktop /app/share/applications/com.github.gosh.gosh_yubikey_manager.desktop
      - install -Dm644 data/icons/hicolor/scalable/apps/com.github.gosh.gosh_yubikey_manager.svg /app/share/icons/hicolor/scalable/apps/com.github.gosh.gosh_yubikey_manager.svg
      - install -Dm644 data/metainfo/com.github.gosh.gosh_yubikey_manager.metainfo.xml /app/share/metainfo/com.github.gosh.gosh_yubikey_manager.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/com.github.gosh.gosh_yubikey_manager/LICENSE
    sources:
      - type: dir
        path: rust/src
        dest: rust/src
      - type: file
        path: rust/Cargo.toml
        dest: rust
        dest-filename: Cargo.toml
      - type: file
        path: rust/Cargo.lock
        dest: rust
        dest-filename: Cargo.lock
      - type: dir
        path: data
        dest: data
      - type: file
        path: LICENSE
        dest-filename: LICENSE
      - flatpak/cargo-sources.json
