name: gosh_authenticator
description: "A Flutter + Rust desktop application for managing OATH credentials on YubiKey devices"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.3.0

  # FFI support
  ffi: ^2.1.0

  # UI components
  google_fonts: ^6.1.0
  fluent_ui: ^4.13.0
  material_symbols_icons: ^4.2719.3
  simple_icons: ^10.1.3
  system_theme: ^3.1.0
  yaru: ^9.0.1

  # Persistence
  shared_preferences: ^2.2.0

  # Utilities
  package_info_plus: ^9.0.0
  url_launcher: ^6.2.0

  # HTTP for favicon fetching
  http: ^1.2.0

  # QR code scanning (for desktop - file-based)
  file_picker: ^8.0.0
  zxing_lib: ^1.1.2
  image: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # FFI binding generation
  ffigen: ^11.0.0

  # Code generation
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.svg
    - assets/icon.png

ffigen:
  name: GoshFfiBindings
  description: FFI bindings for Gosh Authenticator Rust core
  output: 'lib/src/ffi/gosh_ffi_bindings.dart'
  compiler-opts:
    - '-I/usr/lib/clang/21/include'
  headers:
    entry-points:
      - '../rust/include/gosh_ffi.h'
  preamble: |
    // ignore_for_file: always_specify_types
    // ignore_for_file: camel_case_types
    // ignore_for_file: non_constant_identifier_names
    // ignore_for_file: unused_field
    // ignore_for_file: unused_element
    // Auto-generated FFI bindings - do not edit manually
  functions:
    include:
      - 'gosh_.*'
  structs:
    include:
      - 'GoshVersion'
      - 'GoshCredential'
      - 'GoshEvent'
  typedefs:
    include:
      - 'GoshEventCallback'
