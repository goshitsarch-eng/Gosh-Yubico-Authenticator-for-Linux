app-id: com.goshapps.YubicoAuthenticator
runtime: org.kde.Platform
runtime-version: "6.9"
sdk: org.kde.Sdk
command: gosh-authenticator
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pcsc
  - --device=dri
  - --require-version=1.3.2
cleanup:
  - /bin/pcsc-spy
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /share/doc
  - /share/man
  - "*.la"
  - "*.a"
modules:
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibudev=false
      - -Dlibsystemd=false
      - -Dpolkit=false
      - --libdir=/app/lib
    post-install:
      - rm -f /app/sbin/pcscd
      - rmdir /app/sbin || true
      - rm -f /app/share/metainfo/fr.apdu.pcsclite.metainfo.xml
      - install -Dm644 ../COPYING /app/share/licenses/com.goshapps.YubicoAuthenticator/pcsc-lite-COPYING
    cleanup:
      - /lib/libpcscspy.so
      - /lib64/libpcscspy.so
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.1.tar.xz
        sha256: bfcfe38a20afc49849c6bf55325e38f449fc4b26d3923fdc32b969ae41a8741b
        x-checker-data:
          type: anitya
          project-id: 2611
          url-template: https://pcsclite.apdu.fr/files/pcsc-lite-$version.tar.xz

  - name: zxing-cpp
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DZXING_EXAMPLES=OFF
      - -DZXING_BLACKBOX_TESTS=OFF
      - -DZXING_UNIT_TESTS=OFF
      - -DZXING_WRITERS=OFF
    post-install:
      - install -Dm644 LICENSE /app/share/licenses/com.goshapps.YubicoAuthenticator/zxing-cpp-LICENSE
    sources:
      - type: archive
        url: https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v2.3.0.tar.gz
        sha256: b3e03aaaff81d68730d67392a135ac3fdfdf022880c66632ab188d2fe084cda3
        x-checker-data:
          type: anitya
          project-id: 242143
          url-template: https://github.com/zxing-cpp/zxing-cpp/archive/refs/tags/v$version.tar.gz

  - name: gosh-authenticator
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
    post-install:
      - install -Dm644 LICENSE /app/share/licenses/com.goshapps.YubicoAuthenticator/LICENSE
    sources:
      - type: dir
        path: .
        skip:
          - .git
          - .flatpak-builder
          - build
          - dist
