[package]
name = "gosh-authenticator"
version = "2.0.0-alpha.1"
edition = "2021"
rust-version = "1.88"
authors = ["Goshitsarch"]
description = "Cross-platform OATH authenticator for YubiKey devices"
license = "GPL-3.0-or-later"
repository = "https://github.com/goshitsarch-eng/Gosh-Yubico-Authenticator-for-Linux"

[[bin]]
name = "gosh-authenticator"
path = "src/main.rs"
required-features = ["desktop"]

[lib]
name = "gosh_authenticator_core"
path = "src/lib.rs"

[features]
default = ["desktop"]
desktop = ["dep:dioxus", "dep:dioxus-desktop", "dep:arboard", "dep:rfd", "dep:open", "dep:tokio"]

[dependencies]
async-channel = "2.5"
pcsc = "2.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
getrandom = "0.2"
thiserror = "2"
data-encoding = "2.6"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
rqrr = "0.11"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
url = "2"
percent-encoding = "2"
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
dioxus = { version = "=0.7.3", default-features = false, features = ["minimal", "desktop", "document"], optional = true }
dioxus-desktop = { version = "=0.7.3", default-features = false, features = ["tokio_runtime"], optional = true }
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"], optional = true }
rfd = { version = "0.17", optional = true }
open = { version = "5", optional = true }
tokio = { version = "1", features = ["rt", "time"], optional = true }

[dev-dependencies]
qrcode = { version = "0.14", default-features = false, features = ["image"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
