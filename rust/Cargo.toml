[package]
name = "gosh-authenticator"
version = "1.2.1"
edition = "2021"
authors = ["Goshitsarch"]
description = "A native GTK 4 Adwaita desktop application for managing OATH credentials on YubiKey devices"
license = "GPL-3.0-or-later"
repository = "https://github.com/goshitsarch-eng/Gosh-Yubico-Authenticator-for-Linux"

[[bin]]
name = "gosh-authenticator"
path = "src/main.rs"

[lib]
name = "gosh_authenticator_core"
path = "src/lib.rs"

[dependencies]
async-channel = "2.3"
pcsc = "2.9"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
getrandom = "0.2"
thiserror = "2.0"
data-encoding = "2.6"
log = "0.4"
env_logger = "0.11"
gtk = { version = "0.9", package = "gtk4", features = ["v4_14"] }
adw = { version = "0.7", package = "libadwaita", features = ["v1_5"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = "0.25"
rqrr = "0.9"
ureq = "2.12"
base64 = "0.22"
url = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
