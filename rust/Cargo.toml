[package]
name = "gosh-authenticator"
version = "0.1.0"
edition = "2021"
authors = ["Goshitsarch"]
description = "A Flutter + Rust desktop application for managing OATH credentials on YubiKey devices"
license = "GPL-3.0-or-later"
repository = "https://github.com/goshitsarch-eng/Gosh-Yubico-Authenticator-for-Linux"

[lib]
name = "gosh_authenticator_core"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# Async communication between threads
async-channel = "2.3"

# PC/SC smartcard communication
pcsc = "2.9"

# Cryptographic operations for OATH
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
getrandom = "0.2"

# Utilities
thiserror = "2.0"
data-encoding = "2.6"
log = "0.4"
env_logger = "0.11"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
