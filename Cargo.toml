[package]
name = "gosh-authenticator"
version = "2.0.0"
edition = "2021"
authors = ["Goshitsarch"]
description = "A pure Rust desktop application for managing OATH credentials on YubiKey devices"
license = "GPL-3.0-or-later"
repository = "https://github.com/goshitsarch-eng/Gosh-Yubico-Authenticator-for-Linux"

[[bin]]
name = "gosh-authenticator"
path = "src/main.rs"

[dependencies]
# GUI framework
iced = { version = "0.13", features = ["tokio", "svg", "canvas"] }

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# PC/SC smartcard communication
pcsc = "2.9"

# Cryptographic operations for OATH
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
getrandom = "0.2"

# Clipboard
arboard = "3"

# QR code parsing
image = "0.25"
rqrr = "0.8"
rfd = "0.15"

# Persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"

# URI parsing (for otpauth://)
url = "2"
urlencoding = "2"

# Utilities
thiserror = "2.0"
data-encoding = "2.6"
log = "0.4"
env_logger = "0.11"
once_cell = "1"
chrono = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
