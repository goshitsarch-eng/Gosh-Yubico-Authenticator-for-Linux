<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3584e4"/>
      <stop offset="100%" style="stop-color:#1c71d8"/>
    </linearGradient>
    <linearGradient id="keyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f6d32d"/>
      <stop offset="100%" style="stop-color:#e5a50a"/>
    </linearGradient>
  </defs>

  <!-- Shield shape -->
  <path d="M64 8 L112 24 L112 56 C112 88 88 112 64 120 C40 112 16 88 16 56 L16 24 Z"
        fill="url(#shieldGradient)"
        stroke="#1a5fb4"
        stroke-width="2"/>

  <!-- Inner shield highlight -->
  <path d="M64 16 L104 30 L104 56 C104 84 84 104 64 112 C44 104 24 84 24 56 L24 30 Z"
        fill="none"
        stroke="rgba(255,255,255,0.3)"
        stroke-width="1"/>

  <!-- Key head (circle with hole) -->
  <circle cx="64" cy="42" r="16" fill="url(#keyGradient)" stroke="#c64600" stroke-width="2"/>
  <circle cx="64" cy="42" r="6" fill="#1c71d8"/>

  <!-- Key shaft -->
  <rect x="60" y="54" width="8" height="36" rx="2" fill="url(#keyGradient)" stroke="#c64600" stroke-width="1.5"/>

  <!-- Key teeth -->
  <rect x="68" y="70" width="10" height="6" rx="1" fill="url(#keyGradient)" stroke="#c64600" stroke-width="1"/>
  <rect x="68" y="80" width="14" height="6" rx="1" fill="url(#keyGradient)" stroke="#c64600" stroke-width="1"/>
</svg>
